<div class="breadcrumb-section breadcrumb-bg">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 offset-lg-2 text-center">
        <div class="breadcrumb-text">
          <p>Information about</p>
          <h1>Orders</h1>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt-4">
  <!-- Order Stats -->
  <div class="row text-center mb-4">
    <div class="col-md-3"><div class="card card-custom"><h5>Total Orders</h5><p id="totalOrders">...</p></div></div>
    <div class="col-md-3"><div class="card card-custom"><h5>Active Orders</h5><p id="activeOrders">...</p></div></div>
    <div class="col-md-3"><div class="card card-custom"><h5>Completed Orders</h5><p id="completedOrders">...</p></div></div>
    <div class="col-md-3"><div class="card card-custom"><h5>Canceled Orders</h5><p id="canceledOrders">...</p></div></div>
  </div>

  <!-- Orders Table -->
  <div class="row mb-5">
    <div class="col-lg-12">
      <div class="card border-success mx-3">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">Orders Management</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover" id="ordersTable">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Items</th>
                  <th>Status</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Filled dynamically by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Items Table -->
  <div class="row mb-5">
    <div class="col-lg-12">
      <div class="card border-success mx-3">
        <div class="card-header bg-success d-flex justify-content-between align-items-center">
          <h5 class="text-white mb-0">Items Management</h5>
          <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addItemModal">Add New Item</button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover" id="itemsTable">
              <!-- Filled dynamically -->
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Item Modal -->
<div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addItemForm">
        <div class="modal-header">
          <h5 class="modal-title">Add New Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="formFileMultiple" class="form-label">Upload Multiple Pictures</label>
            <input class="form-control" type="file" id="formFileMultiple" name="product_images" multiple>
          </div>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-control" name="category_id"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" name="quantity" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" name="price_each" step="0.01" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Item Modal -->
<div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editItemModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editItemForm">
        <div class="modal-header">
          <h5 class="modal-title">Edit Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="existingImages" class="d-flex flex-wrap gap-2 mt-2"></div>
          <div class="mb-3">
            <label class="form-label">Upload New Pictures</label>
            <input class="form-control" type="file" name="product_images" multiple>
          </div>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-control" name="category_id"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" name="quantity" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" name="price_each" step="0.01" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  new DataTable('#ordersTable');
  new DataTable('#itemsTable');
</script>
