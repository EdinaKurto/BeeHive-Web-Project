<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
    document.getElementById("register-form").addEventListener("submit", function (e) {
        const email = document.getElementById("register-email");
        const username = document.getElementById("register-username");
        const password = document.getElementById("register-password");
        const confirmPassword = document.getElementById("register-confirm-password");

        const emailError = document.getElementById("register-email-error");
        const usernameError = document.getElementById("register-username-error");
        const passwordError = document.getElementById("register-password-error");
        const confirmPasswordError = document.getElementById("register-confirm-password-error");

        // Reset error messages
        emailError.style.display = "none";
        usernameError.style.display = "none";
        passwordError.style.display = "none";
        confirmPasswordError.style.display = "none";

        let valid = true;

        // Email validation
        const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
        if (!emailRegex.test(email.value.trim())) {
            emailError.style.display = "block";
            valid = false;
        }

        // Username validation
        if (username.value.trim().length < 3) {
            usernameError.style.display = "block";
            valid = false;
        }

        // Password length
        if (password.value.length < 6) {
            passwordError.style.display = "block";
            valid = false;
        }

        // Password match
        if (password.value !== confirmPassword.value) {
            confirmPasswordError.style.display = "block";
            valid = false;
        }

        if (!valid) e.preventDefault();
    });
</script>

</head>
<body>
    <div class="register-container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-box shadow-lg">
            <div class="register-left-box"><img src="frontend/img/breadcrumb-bg.jpg" alt="Honey Image"></div> 
            <div class="register-right-box">
                <div class="register-header-text text-center">
                    <h2>Welcome!</h2>
                    <p>"Pure Honey, Happy Bees, Organic Harmony!"</p>
                </div>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="register-email" class="form-label">Email</label>
                        <input type="email" id="register-email" class="register-input form-control" placeholder="Enter your email" required>
                        <small id="register-email-error" class="text-danger" style="display:none;">Invalid email format</small>
                    </div>
                    <div class="mb-3">
                        <label for="register-username" class="form-label">Username</label>
                        <input type="text" id="register-username" class="register-input form-control" placeholder="Choose a username" required>
                        <small id="register-username-error" class="text-danger" style="display:none;">Username must be at least 3 characters</small>
                    </div>
                    <div class="mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password" id="register-password" class="register-input form-control" placeholder="Enter password" required>
                        <small id="register-password-error" class="text-danger" style="display:none;">Password must be at least 6 characters</small>
                    </div>
                    <div class="mb-3">
                        <label for="register-confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" id="register-confirm-password" class="register-input form-control" placeholder="Confirm password" required>
                        <small id="register-confirm-password-error" class="text-danger" style="display:none;">Passwords do not match</small>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn register-btn w-100 text-center">Register</button>
                    </div>
                </form>
                <small>Already a member? <a class="register-login-link" href="#login">Login now</a></small>
            </div> 
        </div>
    </div>
    
</body>
</html>
